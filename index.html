<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#13100d" />
    <title>Varath World</title>
    <meta
      name="description"
      content="A tile-based world of the Knuckle Hills — skills, quests, and the long walk out."
    />

    <!-- The tab, the home screen and the share card. The deployed game had a
         default globe in the tab and no preview at all. Relative paths, to match
         vite's base: "./" so a build works from any path. -->
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Varath World" />
    <meta
      property="og:description"
      content="A tile-based world of the Knuckle Hills — skills, quests, and the long walk out."
    />
    <meta property="og:image" content="./icon.svg" />
    <meta name="twitter:card" content="summary" />

    <!-- Google Fonts: Cinzel (headings) + EB Garamond (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <!-- The whole game renders into this canvas. -->
      <canvas id="game"></canvas>

      <!-- HUD overlays (skills, inventory, log, dialogue) are built by the
           client at runtime and layered on top of the canvas. -->
      <div id="hud"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
